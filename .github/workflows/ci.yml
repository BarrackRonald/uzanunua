name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uzanunua
          POSTGRES_PASSWORD: uzanunua_test
          POSTGRES_DB: uzanunua_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U uzanunua -d uzanunua_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://uzanunua:uzanunua_test@localhost:5432/uzanunua_test?schema=public"
      REDIS_URL: "redis://localhost:6379"
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run Prisma migrations (test db)
        run: pnpm --filter @uzanunua/api exec prisma migrate deploy

      - name: Unit + integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # Security scan and E2E-against-staging steps are added in Phase 25
      # (Security Hardening) and once a staging environment exists to
      # target — documented deferral per Section 81 of the master brief,
      # not an omission.
